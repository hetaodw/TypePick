schema:
  schema_id: typepick_pinyin
  name: TypePick 简体拼音
  version: "0.1.0"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
engine:
  processors: [ascii_composer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_completion: true
  preedit_format:
    - xform/([nl])v/$1ü/
menu:
  page_size: 9
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
    '(': '（'
    ')': '）'
    '[': '【'
    ']': '】'
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
    '/': '/'
    '\': '、'
    '-': '-'
    '=': '='
    '@': '@'
    '#': '#'
    '$': '￥'
    '%': '%'
    '&': '&'
    '*': '*'
    '+': '+'
    '<': '《'
    '>': '》'
    '_': '——'
    '^': '……'
    '~': '~'
    '`': '`'
