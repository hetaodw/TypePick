# Small first-party fixture, NOT a general-purpose production dictionary.
schema:
  schema_id: typepick_demo
  name: TypePick 验证词库
  version: "0.1"
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, ASCII]
ascii_composer:
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
engine:
  processors: [ascii_composer, speller, key_binder, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: typepick_demo
  enable_user_dict: false
  enable_completion: false
menu:
  page_size: 9
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
