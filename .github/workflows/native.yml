name: Native recommendation and Rime bridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and test native module
        shell: pwsh
        run: ./scripts/Build-Core.ps1
      - name: Test real Rime candidates and invalidation
        shell: pwsh
        run: ./scripts/Test-Rime.ps1
      - name: Verify pinned Weasel integration patch
        shell: pwsh
        run: ./scripts/Prepare-Weasel.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-evidence
          path: |
            build/probes/**/results.json
            build/core-native/Testing/Temporary/LastTest.log
  weasel:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Identify toolchain image for dependency cache
        id: image
        shell: pwsh
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache@v4
        id: boost
        with:
          path: build/deps/boost/boost-1.84.0
          key: windows2022-${{ steps.image.outputs.version }}-boost184-${{ hashFiles('scripts/Build-Boost.ps1') }}
      - name: Build pinned Boost with the runner toolchain
        if: steps.boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/Build-Boost.ps1
      - name: Build patched WeaselServer and TSF x64
        shell: pwsh
        run: ./scripts/Build-Weasel.ps1 -BoostRoot ./build/deps/boost/boost-1.84.0
      - name: Build settings and probe
        shell: pwsh
        run: ./scripts/Build-Core.ps1
      - name: Collect exact dependency source and licenses
        shell: pwsh
        run: ./scripts/Get-ReleaseSources.ps1
      - name: Install NSIS build tool
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
      - name: Package executable and corresponding source
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Test install, real server IPC, Tab and uninstall
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TypePick-Windows-x64
          path: dist/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-evidence
          path: |
            build/installer-test-results.json
            build/ipc-test.*.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TypePick-build-diagnostics
          path: |
            build/weasel/output/WeaselServer.exe
            build/weasel/output/WeaselDeployer.exe
            build/weasel/output/weaselx64.dll
            build/weasel/output/rime.dll
            build/core-native/TypePick.exe
            build/package/**
